name: AI Pipeline Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    - name: Run Pipeline (Mock)
      env:
        AI_TEST_GEN_MODE: mock
      run: |
        echo "Running pipeline in mock mode for CI demo"
        ai-test-gen user-story "Users can register an account"
