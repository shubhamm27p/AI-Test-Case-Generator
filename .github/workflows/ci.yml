name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run PyTest
      env:
        # Use mock mode for tests to prevent actual API calls unless secrets are provided
        AI_TEST_GEN_MODE: mock
        # If your tests absolutely require a real API key, you would set it like this:
        # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest tests/ -v
    
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-test-generator:latest .
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/ai-test-generator:latest ${{ secrets.DOCKERHUB_USERNAME }}/ai-test-generator:${{ github.sha }}
        
    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Push Image to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-test-generator:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-test-generator:${{ github.sha }}
