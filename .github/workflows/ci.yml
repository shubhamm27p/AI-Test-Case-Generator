name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run PyTest
      env:
        # Use mock mode for tests to prevent actual API calls unless secrets are provided
        AI_TEST_GEN_MODE: mock
        # If your tests absolutely require a real API key, you would set it like this:
        # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest tests/ -v
    
    - name: Build Docker Image
      # This step only runs if all previous steps (including tests) passed successfully.
      run: |
        docker build -t ai-test-case-generator:${{ github.sha }} .
